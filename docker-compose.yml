# Production stack for a single VPS: PostgreSQL + app + Caddy (automatic HTTPS) + nightly backups.
#   cp .env.production.example .env.production   # fill in secrets & domains
#   docker compose --env-file .env.production up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    # Not published to the host — only reachable from the app container.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      APP_URL: ${APP_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
      AUTH_SECRET: ${AUTH_SECRET}
      HASH_PEPPER: ${HASH_PEPPER}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      WEB_SESSION_DAYS: ${WEB_SESSION_DAYS:-7}
      # Claim photos: "local" keeps them in the uploads volume; "s3" uses any S3-compatible bucket.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      CLAIM_IMAGE_MAX_MB: ${CLAIM_IMAGE_MAX_MB:-8}
      CLAIM_IMAGE_MAX_COUNT: ${CLAIM_IMAGE_MAX_COUNT:-6}
      # Patient phone OTP: zalo | sms | disabled ("console" is refused in production).
      OTP_PROVIDER: ${OTP_PROVIDER:-disabled}
      ZALO_ZNS_ACCESS_TOKEN: ${ZALO_ZNS_ACCESS_TOKEN:-}
      ZALO_ZNS_TEMPLATE_ID: ${ZALO_ZNS_TEMPLATE_ID:-}
      SMS_API_URL: ${SMS_API_URL:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_BRANDNAME: ${SMS_BRANDNAME:-}
    volumes:
      - uploads:/app/storage/uploads
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./docker/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "while true; do /bin/sh /backup.sh; sleep 86400; done"]

volumes:
  uploads:
  pgdata:
  caddy_data:
  caddy_config:
